name: scrape-sync-supermix-prices

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours at minute 23 UTC (02:23, 08:23, 14:23, 20:23 in Santo Domingo).
    # Four runs a day keep every price under 12 hours old even if GitHub skips one.
    - cron: "23 */6 * * *"

concurrency:
  group: scrape-sync-supermix-prices
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scrape-sync-supermix-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: pnpm install --frozen-lockfile

      - name: Route revalidation directly to VPS
        env:
          REVALIDATE_ORIGIN_IP: ${{ secrets.REVALIDATE_ORIGIN_IP }}
        run: |
          if [ -z "$REVALIDATE_ORIGIN_IP" ]; then
            echo "::error::REVALIDATE_ORIGIN_IP is not configured"
            exit 1
          fi
          printf '%s\t%s\n' "$REVALIDATE_ORIGIN_IP" "supermercadosrd.com" | sudo tee -a /etc/hosts >/dev/null

      - name: Run Supermix price sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_MAX_CONNECTIONS: "2"
          REVALIDATE_BASE_URL: ${{ secrets.REVALIDATE_BASE_URL }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: pnpm scrape:sync-supermix-prices
